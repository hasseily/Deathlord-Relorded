name: CMake

on:
  push:
    branches: [master, multi]
    tags: ['[0-9]*']
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            generator: Ninja
            artifact: dlrl-linux-x64
          - os: windows-latest
            generator: "Visual Studio 18 2026"
            artifact: dlrl-windows-x64
          - os: macos-latest
            generator: Ninja
            artifact: dlrl-macos-arm64

    steps:
      - uses: actions/checkout@v5

      # The author-provided 2.0.1 release is the canonical source for the
      # immutable clean HDV. Keep it out of Git, but stage and verify it for
      # real boot tests and complete distributable packages on every OS.
      - name: Fetch clean game HDV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extras
          archive="extras/deathlord-relorded-win-201.zip"
          curl -L --fail --retry 3 \
            https://github.com/hasseily/Deathlord-Relorded/releases/download/v2.0.1/deathlord-relorded-win-201.zip \
            -o "$archive"
          echo "1efb57a4b2062f8d8012a70442ebcd3bc74fd546c4811a16f621a5c01387073f  $archive" \
            | sha256sum --check
          (cd extras && cmake -E tar xf deathlord-relorded-win-201.zip)
          echo "f25f6174554c3341739f7b6d3026d56b375255cfab98ddd0ba4dcac70a723a6d  extras/deathlord-relorded-win-201/Images/Deathlord PRODOS.hdv" \
            | sha256sum --check

      # SDL3 is built by FetchContent. These are the same runner dependencies
      # used by NAC so SDL detects complete Linux video/audio/GL backends.
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build patchelf \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev \
            libwayland-dev libdecor-0-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
            libibus-1.0-dev

      - name: Configure
        run: cmake -B build -G "${{ matrix.generator }}" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # Includes deterministic boot and input captures against the canonical
      # clean HDV staged above, in addition to core and hook tests.
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          set -e
          OUT="dist/${{ matrix.artifact }}"
          mkdir -p "$OUT"
          cp build/dlrl "$OUT/"
          for d in Resources DLRLAssets assets presets shaders Images; do
            cp -r "build/$d" "$OUT/"
          done
          cp -P build/_deps/sdl3-build/libSDL3.so* "$OUT/"
          patchelf --set-rpath '$ORIGIN' "$OUT/dlrl"
          (cd dist && tar -czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }})

      - name: Smoke test packaged Linux app
        if: runner.os == 'Linux'
        env:
          SDL_VIDEODRIVER: offscreen
          SDL_AUDIODRIVER: dummy
        run: |
          cd "dist/${{ matrix.artifact }}"
          ./dlrl \
            --hdv "Images/Deathlord PRODOS.hdv" \
            --smoke-frames 600 \
            --capture "$GITHUB_WORKSPACE/build/Testing/dlrl-linux.bmp"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "dist/${{ matrix.artifact }}"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item build/Release/dlrl.exe  $out/
          Copy-Item build/Release/SDL3.dll $out/
          foreach ($d in 'Resources','DLRLAssets','assets','presets','shaders','Images') {
              Copy-Item -Recurse "build/Release/$d" "$out/"
          }
          Compress-Archive -Path "$out/*" -DestinationPath "dist/${{ matrix.artifact }}.zip"

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          set -e
          APP="build/dlrl.app"
          mkdir -p "$APP/Contents/Frameworks"
          SDL_DYLIB=$(ls build/_deps/sdl3-build/libSDL3*.dylib 2>/dev/null \
                       | grep -v '^l' | head -1 || true)
          if [ -z "$SDL_DYLIB" ]; then
            SDL_DYLIB=$(find build/_deps/sdl3-build -name 'libSDL3*.dylib' \
                         -type f | head -1)
          fi
          BASE=$(basename "$SDL_DYLIB")
          cp -P build/_deps/sdl3-build/libSDL3*.dylib "$APP/Contents/Frameworks/"
          install_name_tool -id "@rpath/$BASE" "$APP/Contents/Frameworks/$BASE"
          OLD=$(otool -L "$APP/Contents/MacOS/dlrl" \
                 | awk '/libSDL3/{print $1; exit}')
          if [ -n "$OLD" ]; then
            install_name_tool -change "$OLD" "@rpath/$BASE" \
                "$APP/Contents/MacOS/dlrl"
          fi
          install_name_tool -add_rpath "@executable_path/../Frameworks" \
              "$APP/Contents/MacOS/dlrl" 2>/dev/null || true
          mkdir -p dist
          ditto -c -k --keepParent "$APP" "dist/${{ matrix.artifact }}.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.*
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
