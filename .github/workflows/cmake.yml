name: CMake

on:
  push:
    branches: [master, multi]
    tags: ['[0-9]*']
  pull_request:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            generator: Ninja
            artifact: dlrl-linux-x64
          - os: windows-latest
            generator: "Visual Studio 18 2026"
            artifact: dlrl-windows-x64
          - os: macos-latest
            generator: Ninja
            artifact: dlrl-macos-universal

    steps:
      - uses: actions/checkout@v5

      # Keep the working tree and saved-party test fixture untouched. Packages
      # get the checksum-pinned original HDV from history in a separate directory.
      - name: Prepare original clean HDV
        shell: bash
        run: |
          git fetch --no-tags --depth=1 origin 645e8eb0c28b984fa42a05bac314d4d509e8a711
          cmake -P cmake/PrepareCleanHdv.cmake

      - name: Verify game images
        shell: bash
        run: |
          set -euo pipefail
          verify_sha256() {
            local expected="$1"
            local file="$2"
            local actual
            actual="$(cmake -E sha256sum "$file")"
            actual="${actual%% *}"
            if [[ "$actual" != "$expected" ]]; then
              echo "SHA-256 mismatch for $file: expected $expected, got $actual" >&2
              exit 1
            fi
          }
          verify_sha256 \
            32311bcd479d902c693a0e14fee572f64cc4661d2c0cf32b28400170d3cf33d9 \
            "build-package-input/Deathlord PRODOS.hdv"
          verify_sha256 \
            c63561b59e56016324b568843c24dfa90b16cfb5b902dc95bcfca2b344da1d03 \
            "assets/Images/Original Master Images/Deathlord - Disk 1, Side A Boot disk.woz"
          verify_sha256 \
            d256156af0827e4e9a01b6053c2fcfb96c6a915f7b744c13ac53caf358ea6cba \
            "assets/Images/Original Master Images/Deathlord - Disk 2, Side A Master scenario A.woz"
          verify_sha256 \
            1ad716e3b17f56ca8a1038715d5b5615ebf55dd58283479390892b26889f669f \
            "assets/Images/Original Master Images/Deathlord - Disk 2, Side A Master scenario B.woz"

      # SDL3 is built by FetchContent. These are the same runner dependencies
      # used by NAC so SDL detects complete Linux video/audio/GL backends.
      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build patchelf \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxkbcommon-dev \
            libwayland-dev libdecor-0-dev libdrm-dev libgbm-dev \
            libasound2-dev libpulse-dev libdbus-1-dev libudev-dev \
            libibus-1.0-dev

      - name: Configure
        shell: bash
        # Link the Release MSVC runtime statically, including SDL, so Windows
        # testers do not need a separately installed Visual C++ redistributable.
        run: |
          platform_args=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            platform_args+=("-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64" "-DCMAKE_OSX_DEPLOYMENT_TARGET=11.0")
          fi
          cmake -B build -G "${{ matrix.generator }}" \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded \
            -DDLRL_CLEAN_HDV_SOURCE="$GITHUB_WORKSPACE/build-package-input/Deathlord PRODOS.hdv" \
            "${platform_args[@]}"

      - name: Build
        run: cmake --build build --config Release --parallel

      # Boot/input captures use the packaged clean HDV. Hacking and map travel
      # use disposable copies of the tracked playable-party HDV as their fixture.
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Verify staged HDV and write build information
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS" in
            Windows) image_dir="build/Release/Images" ;;
            macOS) image_dir="build/dlrl.app/Contents/Resources/Images" ;;
            *) image_dir="build/Images" ;;
          esac
          expected=32311bcd479d902c693a0e14fee572f64cc4661d2c0cf32b28400170d3cf33d9
          actual="$(cmake -E sha256sum "$image_dir/Deathlord PRODOS.hdv")"
          test "${actual%% *}" = "$expected"
          printf 'DLRL tester build\nCommit: %s\nPlatform: %s\nClean HDV SHA-256: %s\n' \
            "$GITHUB_SHA" "${{ matrix.os }}" "$expected" > build/BUILD-INFO.txt

      - name: Package Linux
        if: runner.os == 'Linux'
        run: |
          set -e
          OUT="dist/${{ matrix.artifact }}"
          mkdir -p "$OUT"
          cp build/dlrl "$OUT/"
          for d in Resources DLRLAssets assets presets shaders Images; do
            cp -r "build/$d" "$OUT/"
          done
          cp -P build/_deps/sdl3-build/libSDL3.so* "$OUT/"
          cp docs/testing-builds.md "$OUT/README.md"
          cp build/BUILD-INFO.txt "$OUT/"
          cp packaging/itch/linux.toml "$OUT/.itch.toml"
          patchelf --set-rpath '$ORIGIN' "$OUT/dlrl"
          (cd dist && tar -czf ${{ matrix.artifact }}.tar.gz ${{ matrix.artifact }})

      - name: Smoke test packaged Linux app
        if: runner.os == 'Linux'
        env:
          SDL_VIDEODRIVER: offscreen
          SDL_AUDIODRIVER: dummy
        run: |
          cd "dist/${{ matrix.artifact }}"
          ./dlrl \
            --hdv "Images/Deathlord PRODOS.hdv" \
            --smoke-frames 600 \
            --capture "$GITHUB_WORKSPACE/build/Testing/dlrl-linux.bmp"

      - name: Package Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "dist/${{ matrix.artifact }}"
          New-Item -ItemType Directory -Path $out -Force | Out-Null
          Copy-Item build/Release/dlrl.exe  $out/
          Copy-Item build/Release/SDL3.dll $out/
          foreach ($d in 'Resources','DLRLAssets','assets','presets','shaders','Images') {
              Copy-Item -Recurse "build/Release/$d" "$out/"
          }
          Copy-Item docs/testing-builds.md "$out/README.md"
          Copy-Item build/BUILD-INFO.txt "$out/"
          # Compress-Archive skips dotfiles; stage this manifest for butler and
          # use tar's ZIP writer so direct-download archives include it too.
          Copy-Item packaging/itch/windows.toml "$out/.itch.toml"
          tar -a -c -f "dist/${{ matrix.artifact }}.zip" -C $out .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Package macOS
        if: runner.os == 'macOS'
        run: |
          set -e
          OUT="dist/${{ matrix.artifact }}"
          mkdir -p "$OUT"
          ditto build/dlrl.app "$OUT/dlrl.app"
          APP="$OUT/dlrl.app"
          cp build/BUILD-INFO.txt "$APP/Contents/Resources/"
          cp build/BUILD-INFO.txt "$OUT/"
          cp docs/testing-builds.md "$OUT/README.md"
          cp packaging/itch/macos.toml "$OUT/.itch.toml"
          mkdir -p "$APP/Contents/Frameworks"
          SDL_DYLIB=$(ls build/_deps/sdl3-build/libSDL3*.dylib 2>/dev/null \
                       | grep -v '^l' | head -1 || true)
          if [ -z "$SDL_DYLIB" ]; then
            SDL_DYLIB=$(find build/_deps/sdl3-build -name 'libSDL3*.dylib' \
                         -type f | head -1)
          fi
          BASE=$(basename "$SDL_DYLIB")
          cp -P build/_deps/sdl3-build/libSDL3*.dylib "$APP/Contents/Frameworks/"
          install_name_tool -id "@rpath/$BASE" "$APP/Contents/Frameworks/$BASE"
          OLD=$(otool -L "$APP/Contents/MacOS/dlrl" \
                 | awk '/libSDL3/{print $1; exit}')
          if [ -n "$OLD" ]; then
            install_name_tool -change "$OLD" "@rpath/$BASE" \
                "$APP/Contents/MacOS/dlrl"
          fi
          install_name_tool -add_rpath "@executable_path/../Frameworks" \
              "$APP/Contents/MacOS/dlrl" 2>/dev/null || true
          install_name_tool -delete_rpath "$GITHUB_WORKSPACE/build/_deps/sdl3-build" \
              "$APP/Contents/MacOS/dlrl"
          lipo -verify_arch arm64 x86_64 "$APP/Contents/MacOS/dlrl"
          lipo -verify_arch arm64 x86_64 "$APP/Contents/Frameworks/$BASE"
          # install_name_tool invalidates the linker signatures. Sign nested
          # code first, then seal the complete bundle after all resource copies.
          # These test builds are ad-hoc signed, not Apple-notarized.
          codesign --force --timestamp=none --sign - "$APP/Contents/Frameworks/$BASE"
          codesign --force --timestamp=none --sign - "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          ditto -c -k "$OUT" "dist/${{ matrix.artifact }}.zip"

      - name: Smoke test archived macOS app
        if: runner.os == 'macOS'
        run: |
          set -e
          ditto -x -k "dist/${{ matrix.artifact }}.zip" build/archive-check
          APP="$GITHUB_WORKSPACE/build/archive-check/dlrl.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          cd "$RUNNER_TEMP"
          "$APP/Contents/MacOS/dlrl" --smoke-frames 600 \
            --capture "$GITHUB_WORKSPACE/build/Testing/dlrl-macos-packaged.bmp"
          "$APP/Contents/MacOS/dlrl" --smoke-frames 3 --ui-fixture \
            --capture "$GITHUB_WORKSPACE/build/Testing/dlrl-macos-modern-ui.bmp"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.*
          if-no-files-found: error

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          draft: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
